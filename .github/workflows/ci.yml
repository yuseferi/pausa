name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Create empty dist so the //go:embed directive is satisfied during
      # wails generate module (chicken-and-egg: Wails needs to compile Go
      # to discover bindings, but Go needs frontend/dist to exist).
      - name: Seed empty frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Install frontend dependencies and build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build
        run: go build ./internal/... .

      - name: Vet
        run: go vet ./internal/... .

      - name: Test
        run: go test -race ./internal/... .

  frontend:
    name: Frontend build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Seed empty frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

  package-cross:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            tags: webkit2_41
          - name: windows
            os: windows-latest
            tags: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails' Linux backend is cgo + GTK; the cross-compile job below only
      # proves the pure-Go core type-checks. This installs the real toolchain
      # so `wails build` can produce a runnable binary.
      - name: Install GTK / WebKit dev packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # The //go:embed directive needs frontend/dist to exist before Wails can
      # compile the Go side to discover bindings.
      - name: Seed empty frontend/dist
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # `wails build` also runs the frontend build from wails.json, so this
      # produces a complete, runnable binary for the host OS.
      - name: Build
        run: wails build -tags "${{ matrix.tags }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pausa-${{ matrix.name }}-${{ github.sha }}
          path: build/bin/*
          if-no-files-found: error
          retention-days: 14

  cross-compile:
    name: Cross-compile (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # For cross-compile we only need frontend/dist to exist so the embed
      # directive is satisfied. The !darwin build stubs handle everything else.
      # No Wails CLI or Node needed.
      - name: Seed empty frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Build (GOOS=linux, CGO_ENABLED=0)
        run: GOOS=linux CGO_ENABLED=0 go build ./internal/... .

  lint:
    name: golangci-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Seed empty frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Install frontend dependencies and build
        run: npm ci && npm run build
        working-directory: frontend

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: goinstall
          # Exclude frontend/node_modules (third-party Go files shipped by npm
          # packages) from linting.
          args: ./internal/... .
