name: Build Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for example 1.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} app bundle
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: darwin/arm64
            asset_suffix: arm64-macos
          - arch: amd64
            platform: darwin/amd64
            asset_suffix: amd64-macos

    # Signing / notarization secrets are optional. When absent (e.g. on forks)
    # the job falls back to producing an unsigned build.
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Detect signing configuration
        id: signing
        run: |
          enabled=false
          if [ -n "$APPLE_CERTIFICATE_P12_BASE64" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            if [ -n "$NOTARY_KEY_P8_BASE64" ] || [ -n "$APPLE_ID" ]; then
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "::warning::Signing/notarization secrets are not configured - producing an UNSIGNED build."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # The keychain password (not the .p12 password) unlocks codesign access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: Build app bundle
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -platform "${{ matrix.platform }}" \
            -ldflags "-X pausa/internal/version.Version=${{ steps.version.outputs.version }}"

      - name: Sign, notarize & package
        if: steps.signing.outputs.enabled == 'true'
        run: |
          ASSET="dist/pausa-${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}.zip"
          if [ -n "$NOTARY_KEY_P8_BASE64" ]; then
            printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          scripts/sign-notarize.sh build/bin/pausa.app "$ASSET" "$APPLE_SIGNING_IDENTITY"

      - name: Package app bundle (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          mkdir -p dist
          ASSET="dist/pausa-${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}.zip"
          ditto -c -k --keepParent build/bin/pausa.app "$ASSET"
          shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.sha256

  update-cask:
    name: Update Homebrew cask after release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch release checksums
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ARM_SHA=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "pausa-'"${{ steps.version.outputs.version }}"'-arm64-macos.zip") | .digest' | sed 's/^sha256://')
          AMD_SHA=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "pausa-'"${{ steps.version.outputs.version }}"'-amd64-macos.zip") | .digest' | sed 's/^sha256://')

          if [ -z "$ARM_SHA" ] || [ -z "$AMD_SHA" ]; then
            echo "Missing release assets or digests for $TAG" >&2
            exit 1
          fi

          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "amd_sha=$AMD_SHA" >> "$GITHUB_OUTPUT"

      - name: Rewrite cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARM_SHA="${{ steps.assets.outputs.arm_sha }}"
          AMD_SHA="${{ steps.assets.outputs.amd_sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          arm_sha = os.environ["ARM_SHA"]
          amd_sha = os.environ["AMD_SHA"]

          content = f'''cask "pausa" do
            version "{version}"

            on_arm do
              sha256 "{arm_sha}"
              url "https://github.com/yuseferi/pausa/releases/download/v#{{version}}/pausa-#{{version}}-arm64-macos.zip"
            end

            on_intel do
              sha256 "{amd_sha}"
              url "https://github.com/yuseferi/pausa/releases/download/v#{{version}}/pausa-#{{version}}-amd64-macos.zip"
            end

            name "Pausa"
            desc "Native-feeling macOS break reminder with fullscreen-space overlays"
            homepage "https://yuseferi.github.io/pausa/"

            app "pausa.app"

            zap trash: [
              "~/Library/Application Support/Pausa",
              "~/Library/Logs/Pausa",
            ]
          end
          '''

          Path("Casks/pausa.rb").write_text(content)
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARM_SHA: ${{ steps.assets.outputs.arm_sha }}
          AMD_SHA: ${{ steps.assets.outputs.amd_sha }}

      - name: Commit updated cask
        run: |
          git diff --quiet -- Casks/pausa.rb && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pausa.rb
          git commit -m "chore(cask): update Pausa cask for ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      # The canonical cask lives here; the public tap (yuseferi/homebrew-pausa)
      # is a mirror so `brew install --cask yuseferi/pausa/pausa` resolves.
      - name: Mirror cask to the Homebrew tap repository
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set; skipping the homebrew-pausa mirror."
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/yuseferi/homebrew-pausa.git" \
            "$TAP_DIR"
          cp Casks/pausa.rb "$TAP_DIR/Casks/pausa.rb"
          cd "$TAP_DIR"
          if git diff --quiet -- Casks/pausa.rb; then
            echo "Tap already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pausa.rb
          git commit -m "pausa ${{ steps.version.outputs.version }}"
          git push
