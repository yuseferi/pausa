name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} app bundle
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: darwin/arm64
            asset_suffix: arm64-macos
          - arch: amd64
            platform: darwin/amd64
            asset_suffix: amd64-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build app bundle
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -platform "${{ matrix.platform }}"

      - name: Package app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ASSET="dist/pausa-${VERSION}-${{ matrix.asset_suffix }}.zip"
          ditto -c -k --keepParent build/bin/pausa.app "$ASSET"
          shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
