<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pausa app icon. 1024x1024 master.

  Concept: a break *timer*. A bold countdown ring (a ~280deg progress arc on a
  faint track) reads as "time until your next break", with the pause bars at
  its centre carrying the product's core verb. The ring is intentionally thick
  so it survives downscaling to 16px as a clean circle, where the bars remain
  the instantly-recognisable silhouette.

  Design notes:
  - macOS squircle: 824/1024 canvas with a 185 corner radius (Apple's Big Sur
    icon grid), leaving standard padding for macOS's own icon mask.
  - Background: sky -> blue diagonal gradient with a soft top-left highlight,
    a top rim light, and a subtle bottom inner shade for depth.
  - Ring: radius 280, stroke 84 (>= ~1.3px at 16px). The 80deg gap is centred
    on 12 o'clock so the mark is symmetric about the vertical axis.
  - Foreground: two rounded white pause bars with a soft drop shadow.

  Regenerate the .icns / .iconset / menu-bar PNGs with build-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="48%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="20%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.20"/>
    </linearGradient>

    <filter id="squircleShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="12" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ringShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="barShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="9" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.26"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#squircleShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#rim)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bottomShade)"/>
  </g>

  <!-- timer ring: faint full track + bold countdown arc (gap centred at 12 o'clock) -->
  <circle cx="512" cy="512" r="280" fill="none"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="84"/>
  <g filter="url(#ringShadow)">
    <path d="M 692 297.5 A 280 280 0 1 1 332 297.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.96" stroke-width="84" stroke-linecap="round"/>
  </g>

  <!-- pause bars -->
  <g filter="url(#barShadow)" fill="#ffffff">
    <rect x="394" y="389" width="92" height="246" rx="46" ry="46"/>
    <rect x="538" y="389" width="92" height="246" rx="46" ry="46"/>
  </g>
</svg>
