<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pausa app icon. 1024x1024 master.

  Design notes:
  - macOS "squircle" mask roughly fills 824/1024 of the canvas (Apple's
    Big Sur icon grid). We render a slightly rounded square (220 radius)
    for forward compatibility with macOS's icon mask.
  - Background: cyan-blue radial gradient with a subtle highlight at the
    top-left, deeper at the bottom-right.
  - Foreground: two rounded white pause bars with a soft drop shadow.
  - A subtle rim light at the top of the squircle gives it depth, like
    Apple's first-party icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Squircle gradient: cool blue, deeper at bottom right -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="55%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Subtle inner highlight at the top -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow for the pause bars -->
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer drop shadow for the icon as a whole (used in non-mask
         contexts; macOS will clip it under the actual icon mask). -->
    <filter id="bgShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background.
       Apple's modern icon grid suggests rounded-rect with corner radius
       ~ 22.5% of side; here 100..924 (824 wide) with r=220 keeps it
       visually centered with comfy padding for macOS's own mask. -->
  <g filter="url(#bgShadow)">
    <rect x="100" y="100" width="824" height="824" rx="220" ry="220"
          fill="url(#bgGrad)"/>
  </g>

  <!-- Rim light at the top -->
  <rect x="100" y="100" width="824" height="824" rx="220" ry="220"
        fill="url(#rimGrad)"/>

  <!-- Pause bars: two rounded rects, centered.
       Bar geometry: 120 wide, 360 tall, 60 corner radius, 80 gap. -->
  <g filter="url(#barShadow)" fill="#ffffff">
    <rect x="396" y="332" width="100" height="360" rx="44" ry="44"/>
    <rect x="528" y="332" width="100" height="360" rx="44" ry="44"/>
  </g>
</svg>
